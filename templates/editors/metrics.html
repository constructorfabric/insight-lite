<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metrics catalog — Constructor Insight</title>
<style>
  :root{--bg:#f6f8fa;--panel:#fff;--panel2:#eaeef2;--line:#d0d7de;--ink:#1f2328;--mut:#656d76;
    --acc:#0969da;--acc-soft:#edecfe;--violet:#8b5cf6;--violet-bg:#f0ebfe;--code-bg:#0d1117;--code-fg:#c9d1d9}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  /*SHELL_CSS*/
  main.wrap{padding:20px 34px 90px}
  h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
  .sub{color:var(--ink2,var(--mut));font-size:13.5px;margin:0 0 6px;max-width:78ch}
  .bar{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 0 10px;margin-bottom:6px}
  .bar-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .search{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;border:1px solid var(--line2,var(--line));
    border-radius:11px;padding:9px 13px;background:var(--panel);box-shadow:var(--sh)}
  .search input{border:none;background:transparent;outline:none;color:var(--ink);font:inherit;font-size:14px;width:100%}
  .search svg{width:17px;height:17px;stroke:var(--mut);fill:none;stroke-width:2;flex:none}
  .seg{display:inline-flex;border:1px solid var(--line2,var(--line));border-radius:10px;overflow:hidden;box-shadow:var(--sh)}
  .seg button{border:none;background:var(--panel);color:var(--ink2,var(--mut));padding:9px 13px;font:600 12.5px/1 inherit;cursor:pointer}
  .seg button.on{background:var(--acc);color:#fff}
  .expandbtn{border:1px solid var(--line2,var(--line));background:var(--panel);color:var(--ink2,var(--mut));
    border-radius:10px;padding:9px 13px;font:600 12.5px/1 inherit;cursor:pointer;box-shadow:var(--sh)}
  .navchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .navchip{border:1px solid var(--line);background:var(--panel);color:var(--ink2,var(--mut));border-radius:999px;
    padding:5px 11px;font:600 12px/1 inherit;cursor:pointer;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
  .navchip:hover{border-color:var(--acc);color:var(--acc-ink,var(--acc))}
  .navchip .c{color:var(--mut);font-weight:700}
  .group{margin-top:22px}
  .group-h{display:flex;align-items:baseline;gap:9px;margin:0 0 8px;cursor:pointer;user-select:none}
  .group-h h2{font-size:16px;font-weight:800;letter-spacing:-.02em;margin:0}
  .group-h .gc{font-size:12px;color:var(--mut);font-weight:700}
  .group-h .chev{margin-left:auto;color:var(--mut);transition:transform .2s}
  .group.closed .chev{transform:rotate(-90deg)} .group.closed .list{display:none}
  .list{border:1px solid var(--line);border-radius:var(--r-sm,11px);overflow:hidden;background:var(--panel);box-shadow:var(--sh)}
  .m{border-top:1px solid var(--line)} .m:first-child{border-top:none} .m.hidden{display:none}
  .m-row{display:flex;align-items:center;gap:12px;padding:11px 15px;cursor:pointer}
  .m-row:hover{background:var(--panel2)}
  .m-name{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px;font-weight:700;flex:none;min-width:160px}
  .m-desc{font-size:13px;color:var(--ink2,var(--ink));flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .m.open .m-desc{white-space:normal}
  .pill{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;flex:none}
  .pill.direct{background:var(--acc-soft);color:var(--acc-ink,var(--acc))}
  .pill.computed{background:var(--violet-bg);color:var(--violet)}
  .unit{font-size:11px;color:var(--mut);flex:none;min-width:56px;text-align:right}
  .m-chev{color:var(--mut);flex:none;transition:transform .2s;font-size:12px} .m.open .m-chev{transform:rotate(90deg)}
  .m-body{display:none;padding:2px 15px 16px 15px} .m.open .m-body{display:block}
  .frow{display:flex;gap:10px;align-items:baseline;margin:4px 0;font-size:12.5px}
  .frow .k{color:var(--mut);font-weight:700;flex:0 0 84px;text-transform:uppercase;font-size:10.5px;letter-spacing:.04em;padding-top:2px}
  .formula{background:var(--panel2);padding:3px 8px;border-radius:6px;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--ink)}
  .where{color:var(--ink2,var(--mut));font-family:ui-monospace,Menlo,monospace;font-size:12px}
  .snip{background:var(--code-bg);color:var(--code-fg);border-radius:9px;padding:11px 13px;margin:8px 0 0;
    overflow:auto;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.55;white-space:pre}
  .empty{padding:26px;text-align:center;color:var(--mut);font-size:13px}
</style></head>
<body><div class="app"><!--SIDEBAR--><main class="wrap">
<h1>Metrics catalog</h1>
<p class="sub">/*SUB*/</p>
<div class="bar">
  <div class="bar-row">
    <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" placeholder="Search metrics by name or meaning…" autocomplete="off"></label>
    <span class="seg" id="typeSeg"><button data-t="all" class="on">All</button><button data-t="direct">Direct</button><button data-t="computed">Computed</button></span>
    <button class="expandbtn" id="toggleAll">Expand all</button>
  </div>
  <div class="navchips">/*NAV*/</div>
</div>
<div id="content">/*SECTIONS*/</div>
<div class="empty" id="empty" hidden>No metrics match your search.</div>
</main></div>
<script>
(function(){
  "use strict";
  var $=function(s,r){return (r||document).querySelector(s);};
  var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
  var q="", tfilter="all", allOpen=false;
  function apply(){
    var any=false;
    $$(".group").forEach(function(g){
      var shown=0;
      $$(".m",g).forEach(function(m){
        var hit=(tfilter==="all"||m.dataset.type===tfilter)
          && (!q || m.dataset.name.indexOf(q)>=0 || m.dataset.desc.indexOf(q)>=0);
        m.classList.toggle("hidden",!hit); if(hit) shown++;
      });
      g.style.display=shown?"":"none"; if(shown) any=true;
    });
    $("#empty").hidden=any;
  }
  document.addEventListener("input",function(e){ if(e.target.id==="q"){ q=e.target.value.toLowerCase().trim(); apply(); } });
  document.addEventListener("click",function(e){
    var t=e.target.closest("#typeSeg button");
    if(t){ $$("#typeSeg button").forEach(function(b){b.classList.remove("on");}); t.classList.add("on"); tfilter=t.dataset.t; apply(); return; }
    if(e.target.id==="toggleAll"){ allOpen=!allOpen; e.target.textContent=allOpen?"Collapse all":"Expand all";
      $$(".m").forEach(function(m){m.classList.toggle("open",allOpen);}); return; }
    var jump=e.target.closest("[data-jump]");
    if(jump){ var el=$('.group[data-group="'+jump.dataset.jump+'"]'); if(el){ el.classList.remove("closed"); el.scrollIntoView({behavior:"smooth",block:"start"}); } return; }
    var gh=e.target.closest(".group-h"); if(gh){ gh.closest(".group").classList.toggle("closed"); return; }
    var row=e.target.closest(".m-row"); if(row){ row.closest(".m").classList.toggle("open"); return; }
  });
})();
</script>
</body></html>
