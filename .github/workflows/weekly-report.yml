name: Weekly Fabric report

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch: {}     # manual run button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fabric-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect data
        env:
          # Org-scoped read token. The default GITHUB_TOKEN only sees THIS repo,
          # so to read the whole org set a secret FABRIC_REPORT_TOKEN (PAT with
          # read:org + repo). Falls back to GITHUB_TOKEN if unset.
          GH_TOKEN: ${{ secrets.FABRIC_REPORT_TOKEN || secrets.GITHUB_TOKEN }}
        run: python collect.py

      - name: Render HTML
        run: |
          python render.py
          mkdir -p _site
          cp report.html _site/index.html

      - name: Send email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python email_report.py

      # The report contains per-person contribution stats (names, companies).
      # GitHub Pages is PUBLIC unless the org enforces access control, so
      # publishing is opt-in: set the repo variable PUBLISH_PAGES=true only
      # after confirming the Pages visibility policy allows it.
      - name: Upload Pages artifact
        if: ${{ vars.PUBLISH_PAGES == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: ${{ vars.PUBLISH_PAGES == 'true' }}
        id: deploy
        uses: actions/deploy-pages@v4
