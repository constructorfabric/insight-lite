name: CI

# One pipeline, so the ordering is a fact rather than a convention: `build` declares
# `needs: test`, which means an image can only exist for a commit whose suite passed.
# Two separate workflows would have run in parallel and happily published a broken image
# while the tests were still going red.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request: {}
  workflow_dispatch:
    inputs:
      arm64:
        description: "Also build linux/arm64 (needed by the tags users pull)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # node is preinstalled on ubuntu-latest, so the inline-JS validity tests run
      # instead of skipping.
      #
      # -t . matters: without it the start directory is also the top-level directory,
      # so test modules import as top-level names and tests/__init__.py — which installs
      # the state isolation and the seeded fixture store — never runs. With `-t .` they
      # import as tests.test_*, the package initialises first, and the run is both
      # isolated and reproducible. tests/test_state_isolation.py fails loudly if that
      # ever stops being true.
      - name: Run test suite
        run: python -m unittest discover -s tests -t . -v

      # The frontend suite runs in the SAME job as the Python one, so `build`'s
      # `needs: test` gate covers both: an image cannot exist for a commit whose
      # component tests are red. Node is preinstalled on ubuntu-latest.
      #
      # jsdom, not a browser: these cover markup and state. Anything needing real
      # layout is frontend/visual/, which drives a running server and is not part
      # of this pipeline.
      - name: Run frontend tests
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test

  build:
    name: Image
    needs: test                     # the gate: no image without a green suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write               # only this job needs to write to the registry
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      # No setup-qemu-action: this job builds amd64 on an amd64 runner, and arm64 is
      # built natively by the `arm` job below. Emulating one arch from the other used
      # to make this step 4x slower than the rest of the pipeline put together.
      - uses: docker/setup-buildx-action@v3

      # A pull request builds but never publishes. That still catches the failure mode
      # worth catching — a Dockerfile or layout change that breaks the image — without
      # letting an unreviewed commit put anything in the registry.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # ONLY the commit SHA here. `latest` and the semver tags are what users pull,
          # so they are written once, by the manifest merge, as a real multi-arch list —
          # never by this job as amd64 alone.
          #
          # That is not tidiness. When this job published `latest` too, a push that
          # cancelled the in-flight run (concurrency: cancel-in-progress) left `latest`
          # pointing at an amd64-only manifest, and an ARM user pulling it got "no
          # matching manifest". Now an interrupted run leaves the PREVIOUS good `latest`
          # alone, which is the failure everyone would choose.
          #
          # sha-<commit> is amd64-first on purpose: production is x86_64 and
          # scripts/deploy.sh pins it, so it must not wait for the other architecture.
          tags: |
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=Insight Lite
            org.opencontainers.image.description=Self-hosted engineering-productivity and delivery analytics for a GitHub organisation

      # Single-arch first, loaded into the local daemon so it can actually be run.
      # Publishing an image nobody has started is how "it builds" gets mistaken for
      # "it works" — the smoke test below is the point of this step.
      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: insight-lite:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 127.0.0.1:8099:8080 insight-lite:smoke
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8099/health; then ok=1; break; fi
            sleep 1
          done
          [ "${ok:-}" = 1 ] || { echo "::error::/health never came up"; docker logs smoke; exit 1; }

          # A fresh image has no data, so the root must send you to the setup wizard.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/)
          [ "$code" = 302 ] || { echo "::error::expected a redirect to /setup, got $code"; exit 1; }

          # The failure this catches: templates/ and assets/ live beside backend/, and a
          # wrong ROOT inside the image would not surface until a page was rendered.
          docker exec smoke python3 -c "
          import sys, os; sys.path.insert(0, '/work/backend')
          import spa, render
          assert spa.entry_assets('overview'), 'Vite manifest missing from the image'
          assert os.path.isdir(os.path.join(render.ROOT, 'templates')), 'templates/ not found'
          print('assets and templates resolve')
          "

          # And that the demo seeder still produces data the views can serialise inside
          # the image, which is the only end-to-end check of collect-shaped data we can
          # run without a GitHub token. It used to render the Jinja monolith and weigh
          # the HTML; that monolith is gone, so it asserts the same reach where the data
          # now goes — the JSON payloads the React pages read.
          docker exec smoke sh -c 'cd /work && python3 backend/demo.py --db /tmp/smoke.db >/dev/null'
          docker exec -e REPORT_DB=/tmp/smoke.db smoke python3 -c "
          import sys; sys.path.insert(0, '/work/backend')
          import render
          model = render.build_model(render.load_data())
          meta = {'org': (model.get('meta') or {}).get('org'), 'generated': model.get('generated')}
          over = render.overview_json(model, meta)
          assert over['ok'], 'overview payload not ok'
          assert len(over['kpis']) == 8, f\"KPI row has {len(over['kpis'])} tiles\"
          assert over['companies']['rows'], 'no contribution-by-company rows'
          assert over['weekly']['rows'], 'no weekly activity'
          print(f\"views serialise: {len(over['kpis'])} tiles, {len(over['companies']['rows'])} companies\")
          "
          # The MCP service runs from the SAME image with a different command, and it
          # was NOT covered here — which is how an image shipped with mcp 2.0 installed
          # and mcp_server.py crash-looping on `from mcp.server.fastmcp import FastMCP`.
          # Importing the module is the cheapest check that would have caught it.
          docker exec smoke python3 -c "
          import sys; sys.path.insert(0, '/work/backend')
          import mcp_server
          print('mcp_server imports')
          "
          # ...then start it the way docker-compose.yml does and complete a real
          # JSON-RPC handshake. An import proves the module loads; only initialize
          # proves the transport is mounted and the server answers.
          docker rm -f smoke >/dev/null
          docker run -d --name smoke-mcp -e MCP_HOST=0.0.0.0 -e MCP_PORT=8082 \
            -p 127.0.0.1:8102:8082 insight-lite:smoke python backend/mcp_server.py
          for i in $(seq 1 20); do
            if curl -fsS -o /tmp/mcp.out -X POST http://127.0.0.1:8102/mcp \
                 -H 'Content-Type: application/json' \
                 -H 'Accept: application/json, text/event-stream' \
                 -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
            then mcp_ok=1; break; fi
            sleep 1
          done
          [ "${mcp_ok:-}" = 1 ] || { echo "::error::the MCP server never answered initialize"; docker logs smoke-mcp; exit 1; }
          grep -q '"serverInfo"' /tmp/mcp.out || { echo "::error::MCP initialize returned no serverInfo:"; cat /tmp/mcp.out; exit 1; }
          echo "MCP handshake: $(tr -d '\n' < /tmp/mcp.out | tail -c 160)"
          docker rm -f smoke-mcp >/dev/null

      # Only now, and only for a real push: publish amd64 under every tag. This is the
      # step a deploy waits on — scripts/deploy.sh pins sha-<commit>, and production is
      # amd64 — so it must not be held up by the other architecture.
      - name: Build and push (amd64)
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # keeps the package listing to real architectures instead of an
          # "unknown/unknown" provenance entry beside them
          provenance: false

  # arm64, on an arm64 runner. Not for us — production is x86_64 — but for people
  # running this on their own ARM hardware, a Raspberry Pi included, who pull `latest`
  # rather than a commit sha. So it has to exist on the tags USERS consume, and does
  # not have to exist on every sha-<commit>: that split is what lets a deploy go out
  # without waiting for it.
  #
  # Native rather than emulated. Under QEMU this leg took ~16 of the pipeline's 21
  # minutes, because the frontend's npm install and Vite build ran interpreted;
  # ubuntu-24.04-arm is free for public repositories and runs it as fast as amd64.
  arm:
    name: Image (arm64) + manifest
    needs: [test, build]
    # Not `inputs.arm64 != false`: on a push `inputs.arm64` is the empty string,
    # GitHub compares loosely, '' == false, and the job skipped itself on the very
    # first run. Gate the input on the event that actually carries one.
    if: |
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || inputs.arm64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pushed by DIGEST, with no tag of its own: the manifest job below is what makes
      # it reachable, so a half-finished multi-arch publish never leaves an arm64-only
      # image sitting under a tag somebody might pull.
      - name: Build and push (arm64)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
          provenance: false

      # Re-point the user-facing tags at a real multi-arch manifest. This lives in the
      # arm64 job rather than a fourth one on purpose: the split into per-arch jobs made
      # the BUILDS 10x faster (88s natively against ~16min emulated) and the pipeline
      # SLOWER, because four jobs pay four runner acquisitions and on a bad day one of
      # those cost nine minutes on its own. Merging here removes a hop.
      #
      # It costs ordering — arm64 now waits for amd64 instead of running beside it — and
      # that is the right way round: amd64 is what a deploy pins, so it lands first and
      # scripts/deploy.sh can go out while this job is still finishing.
      #
      # Until this step runs the tags resolve to amd64 alone, which is
      # correct-but-partial rather than broken: an ARM user pulling in that window gets
      # "no matching manifest", not an image that will not start. Opting arm64 out
      # leaves the commit's tags amd64-only, the deliberate cost of a fast deploy.
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # `latest` tracks main; the SHA tag is re-pointed at the multi-arch list it
          # was published under as amd64 alone; a v* tag brings its semver tags.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Merge the two architectures under each tag
        run: |
          set -euo pipefail
          amd64='${{ needs.build.outputs.digest }}'
          arm64='${{ steps.push.outputs.digest }}'
          [ -n "$amd64" ] && [ -n "$arm64" ] || { echo "::error::missing a digest: amd64=$amd64 arm64=$arm64"; exit 1; }
          # `if`, not `[ … ] && …`: under `set -e` a blank line in the tag list would
          # make the loop body's last command return 1 and kill the step.
          args=""
          while read -r tag; do
            if [ -n "$tag" ]; then args="$args -t $tag"; fi
          done <<< '${{ steps.meta.outputs.tags }}'
          # shellcheck disable=SC2086
          docker buildx imagetools create $args \
            "${IMAGE}@${amd64}" "${IMAGE}@${arm64}"
          for tag in ${{ steps.meta.outputs.tags }}; do
            echo "== $tag"
            docker buildx imagetools inspect "$tag" | grep -E "Platform|MediaType" | head -6
          done
