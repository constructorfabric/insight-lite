# nginx site for the report portal behind Cloudflare (TLS terminated at the CF edge
# by the *.example.com certificate). Serves insight.example.com -> oauth2-proxy:4180,
# and 301-redirects the previous domain (insight.example.com) to it. The origin cert
# below is the old Let's Encrypt cert, reused because Cloudflare runs in Full (not
# strict) mode; swap in a Cloudflare Origin certificate for Full (strict).
server {
    server_name insight.example.com;

    location ~ ^/mcp(/|$) {              # MCP protocol endpoint only (/mcp, /mcp/…) —
                                          # NOT /mcp-info etc., which are portal pages.
                                          # Bypasses the oauth gate (own bearer token).
        auth_basic off;
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;
    }
    location / {                          # everything else -> oauth2-proxy -> report
        proxy_pass http://127.0.0.1:4180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 300s;
    }

    listen [::]:443 ssl default_server;
    listen 443 ssl default_server;
    ssl_certificate /etc/letsencrypt/live/insight.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/insight.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Old domain -> permanent redirect to the new one.
server {
    server_name insight.example.com;
    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/insight.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/insight.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://insight.example.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name insight.example.com insight.example.com;
    return 301 https://insight.example.com$request_uri;
}
